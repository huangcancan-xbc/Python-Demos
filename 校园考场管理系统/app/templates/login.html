{% extends "base.html" %}
{% block title %}登录 - 校园考场管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 7vh;">
    <div class="col-sm-10 col-md-5 col-lg-4">
        <div class="card border-0" style="box-shadow: var(--shadow-lg);">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div style="width:48px; height:48px; background:var(--indigo-600); border-radius:12px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:14px;">
                        <i class="bi bi-box-arrow-in-right text-white" style="font-size:1.2rem;"></i>
                    </div>
                    <h5 style="font-weight:800; color:var(--stone-900); letter-spacing:-0.01em;" class="mb-1">用户登录</h5>
                    <small style="color:var(--stone-400);">请输入您的账号信息</small>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   required placeholder="请输入用户名" autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   required placeholder="请输入密码" autocomplete="current-password">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="role" class="form-label">登录角色</label>
                        <select class="form-select" id="role" name="role">
                            <option value="">-- 请选择角色 --</option>
                            <option value="admin">管理员</option>
                            <option value="teacher">教师</option>
                            <option value="student">学生</option>
                        </select>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> 登 录
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <span style="color:var(--stone-400); font-size:0.88rem;">没有账号？</span>
                    <a href="{{ url_for('auth.register') }}" style="color:var(--indigo-600); text-decoration:none; font-weight:600;">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
